[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rknn-model-converter"
version = "0.1.0"
description = "Standalone conversion tools for Rockchip RKNN models"
readme = "README.md"
requires-python = ">=3.10,<3.13"

[tool.setuptools]
py-modules = ["rknn_converter"]
